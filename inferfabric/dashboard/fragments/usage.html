<div class="tab-content" id="tab-usage">
  <!-- 用量页（UX v3 D2）：一个窗口驱动整页——报告驱动 KPI/趋势/分解，
       撤除 A2 临时驻留的旧监控卡（功耗双轴/Token 双卡/Agent 卡/延迟卡）。
       窗口控件用 use-seg 独立类名，避免旧 monitor.js 全站分段委托误接。 -->
  <style>
    .use-seg { display: inline-flex; gap: 2px; background: var(--surface-2, rgba(128,128,128,.08)); border-radius: 8px; padding: 2px; }
    .use-seg-btn { border: 0; background: transparent; color: var(--ink-2, #9aa5b5); font-size: 12px; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
    .use-seg-btn.on { background: var(--accent, #b45a3c); color: #fff; }
    .use-kpi-val { font-size: 22px; font-weight: 600; }
    .use-kpi-sub { font-size: 12px; font-weight: 400; color: var(--ink-3, #8a93a3); }
    .use-badge-warn { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: rgba(180,83,9,.15); color: var(--warn, #b45309); }
  </style>
  <div class="if-grid">

    <!-- 窗口选择 + 报告元信息 -->
    <div class="col-12">
      <div class="if-card">
        <div class="if-card-hdr">
          <span class="if-card-title">用量总览</span>
          <span class="if-card-sub" id="useMetaLine"></span>
          <div class="use-seg" role="group" aria-label="统计窗口">
            <button type="button" class="use-seg-btn" id="useWin-1h" data-win="1h" aria-pressed="false">1 小时</button>
            <button type="button" class="use-seg-btn on" id="useWin-24h" data-win="24h" aria-pressed="true">24 小时</button>
            <button type="button" class="use-seg-btn" id="useWin-7d" data-win="7d" aria-pressed="false">7 天</button>
            <button type="button" class="use-seg-btn" id="useWin-30d" data-win="30d" aria-pressed="false">30 天</button>
          </div>
        </div>
        <div class="if-card-body">
          <div id="useTruncBanner" class="bad" style="display:none"></div>
        </div>
      </div>
    </div>

  </div>
  <div class="if-grid">

    <!-- KPI ×4：请求 / Tokens / 估算成本 / KV 前缀缓存命中 -->
    <div class="col-6">
      <div class="if-card">
        <div class="if-card-hdr"><span class="if-card-title">请求数</span></div>
        <div class="if-card-body"><div class="use-kpi-val mono" id="useKpiReq">—</div></div>
      </div>
    </div>
    <div class="col-6">
      <div class="if-card">
        <div class="if-card-hdr"><span class="if-card-title">Tokens</span></div>
        <div class="if-card-body"><div class="use-kpi-val mono" id="useKpiTok">—</div></div>
      </div>
    </div>
    <div class="col-6">
      <div class="if-card">
        <div class="if-card-hdr"><span class="if-card-title">估算成本</span></div>
        <div class="if-card-body"><div class="use-kpi-val mono" id="useKpiCost">—</div></div>
      </div>
    </div>
    <div class="col-6">
      <div class="if-card">
        <div class="if-card-hdr">
          <span class="if-card-title">KV 前缀缓存命中</span>
          <span class="if-card-sub" id="useKpiCacheLbl"></span>
        </div>
        <div class="if-card-body"><div class="use-kpi-val mono" id="useKpiCache">—</div></div>
      </div>
    </div>

    <!-- 请求趋势：本地/云端堆叠柱（蓝/琥珀）；unknown 另作覆盖说明 -->
    <div class="col-12">
      <div class="if-card">
        <div class="if-card-hdr"><span class="if-card-title">请求趋势</span>
          <span class="if-card-sub">本地 / 云端 · 报告桶</span></div>
        <div class="if-card-body">
          <div class="mon-chart-wrap">
            <div id="useTrendChart" class="mon-chart"></div>
            <div id="useTrendEmpty" class="mon-chart-empty" style="display:none">窗口内暂无请求</div>
          </div>
          <div class="use-kpi-sub" id="useTrendNote"></div>
        </div>
      </div>
    </div>

    <!-- 模型分解 -->
    <div class="col-12">
      <div class="if-card">
        <div class="if-card-hdr"><span class="if-card-title">模型分解</span>
          <span class="if-card-sub">份额按 Tokens in · 未配价标「未计价」</span></div>
        <div class="if-card-body"><div id="useModelTable"></div></div>
      </div>
    </div>

    <!-- 客户端分解（认领路径复用全局认领弹窗） -->
    <div class="col-12">
      <div class="if-card">
        <div class="if-card-hdr"><span class="if-card-title">客户端分解</span>
          <span class="if-card-sub">未识别客户端可认领——识别后计入其用量</span></div>
        <div class="if-card-body"><div id="useAgentTable"></div></div>
      </div>
    </div>

    <!-- 电费估算：设备功耗（非整机电费）；云费单列，不求和 -->
    <div class="col-12">
      <div class="if-card">
        <div class="if-card-hdr"><span class="if-card-title">电费估算</span>
          <span class="if-card-sub" id="usePowerSub"></span></div>
        <div class="if-card-body">
          <div class="mon-power-hero">
            <span class="mon-power-hero-val mono" id="usePowerTotals">—</span>
          </div>
          <div class="use-kpi-sub" id="useCloudCost"></div>
          <div class="use-kpi-sub" id="usePowerNote"></div>
          <div id="usePowerEmpty" class="mon-chart-empty" style="display:none">功耗采样暂不可用</div>
        </div>
      </div>
    </div>

  </div>
</div>
