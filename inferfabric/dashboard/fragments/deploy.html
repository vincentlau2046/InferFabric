<div class="tab-content" id="tab-deploy">

  <div class="if-grid">
    <!-- 部署表单卡 -->
    <div class="col-6">
      <div class="if-card" id="depDeployCard">
        <div class="if-card-hdr">
          <span class="if-card-title">部署模型</span>
          <span class="if-card-sub">生成 YAML 并切换</span>
        </div>
        <div class="if-card-body">
          <div class="if-form-row">
            <label class="if-field-label" for="depName">模型名称</label>
            <input class="if-field-input mono" id="depName" type="text"
                   placeholder="如 qwen2.5:7b" autocomplete="off" spellcheck="false" />
          </div>
          <div class="if-form-row">
            <label class="if-field-label" for="depType">引擎类型</label>
            <select class="if-field-select" id="depType">
              <option value="vllm">vLLM</option>
              <option value="llama_cpp">llama.cpp</option>
            </select>
          </div>
          <p class="if-field-hint">后端自动生成 YAML 并分配端口与显存。其他引擎（SGLang / NInfer / Ollama 服务）请在 models.d/ 手动编写 YAML 后用 switch 加载。</p>
        </div>
        <div class="if-card-actions">
          <button type="button" class="btn btn-pri btn-sm" data-action="deploy">部署并切换</button>
        </div>
      </div>
    </div>

    <!-- 拉取表单卡 -->
    <div class="col-6">
      <div class="if-card" id="depPullCard">
        <div class="if-card-hdr">
          <span class="if-card-title">拉取模型</span>
          <span class="if-card-sub">下载权重到本地磁盘</span>
        </div>
        <div class="if-card-body">
          <div class="if-form-row">
            <label class="if-field-label" for="pullName">模型名称</label>
            <input class="if-field-input mono" id="pullName" type="text"
                   placeholder="如 qwen2.5:7b" autocomplete="off" spellcheck="false" />
          </div>
          <div class="if-form-row">
            <label class="if-field-label" for="pullFw">框架</label>
            <select class="if-field-select" id="pullFw">
              <option value="ollama">ollama</option>
              <option value="vllm">vllm</option>
              <option value="llama_cpp">llama_cpp</option>
            </select>
          </div>
          <p class="if-field-hint">仅 ollama 框架支持拉取；vllm / llama_cpp 需手动下载。</p>
        </div>
        <div class="if-card-actions">
          <button type="button" class="btn btn-sec btn-sm" data-action="pull">拉取</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 长任务进度态（deploy / pull）—— 由 deploy.js 按需显隐 -->
  <div class="if-card" id="depProgressCard" style="display:none">
    <div class="if-card-hdr">
      <span class="if-card-title">任务进度</span>
    </div>
    <div class="if-card-body">
      <div id="deployProgress">
        <div class="if-empty">暂无任务</div>
      </div>
    </div>
  </div>

</div>
