    <rect x="50" y="85" width="220" height="70" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
    <text x="160" y="112" text-anchor="middle" font-size="11" fill="#6b7280">🧑 客户端</text>
