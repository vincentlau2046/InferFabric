    <text x="540" y="112" text-anchor="middle" font-size="11" fill="#6b7280">🌐 协议入口</text>
    <text x="540" y="130" text-anchor="middle" font-size="10" fill="#9ca3af">OpenAI /v1/chat/completions</text>
    <text x="540" y="144" text-anchor="middle" font-size="10" fill="#9ca3af">Anthropic /v1/messages</text>
  </g>

  <g filter="url(#shadow-sm)">
