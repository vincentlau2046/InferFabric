  <rect width="1100" height="780" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">InferFabric — 系统架构总览</text>
