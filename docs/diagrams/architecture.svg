    <text x="940" y="112" text-anchor="middle" font-size="11" fill="#6b7280">🔌 管理入口</text>
    <text x="940" y="130" text-anchor="middle" font-size="10" fill="#9ca3af">CLI: iff status / switch</text>
    <text x="940" y="144" text-anchor="middle" font-size="10" fill="#9ca3af">Dashboard: http://:8999</text>
  </g>

