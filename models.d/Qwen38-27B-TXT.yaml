# ═══════════════════════════════════════════════════════════════════
# 本文件 = 模型「启动真相源」（default 场景的基线值，only 由人/工具链外修改，
# tune 工具链对其只读）。但**当前机器上生效的 live 值 ≠ 仅看本文件**：
#     live = 本 YAML 值 ＋ 应用层 overlay（~/.inferfabric/active_scenarios.yaml，
#            由 `iff tune <preset>` 写入；示例 `iff status` 的 scenario_active）
# 判断「当前是哪个场景」以 `iff tune Qwen38-27B-TXT` 或 Dashboard ⚙场景 为准，
# 不要只看本 YAML —— 场景已应用时本 YAML 数值是 baseline，不等于 live。
#
# 场景一览（定义在 models.d/scenarios.yaml 侧车，本文件不内联 presets）：
#   default     C4 · 155000 · draft1 · kv 632000（= 本文件值；池顶 620032，满载余量 1.9%）
#   short-ctx   C6 · 131072 · draft2 · kv 590000（低延迟；池顶 786432，超卖 25.0%）
#   small-batch C3 · 262144 · draft3 · kv 645000（顶窗长文档；池顶 786432，超卖 18.0%）
#   big-batch   C5 · 168000 · draft1 · kv 612000（长窗批处理；池顶 840000，超卖 27.1%）
# kv_capacity = 632000 是 default 基线的物理 KV 池（NVFP4）；各场景可覆盖
# （scenarios.yaml 每场景 kv_capacity 字段，不写=沿用本值）。高并发档降 KV 防 OOM。
# 超卖是刻意设计（C/W 配出的池顶 > 池时满载靠 preempt 兜底），仅 ⚠ 不阻塞。
# ═══════════════════════════════════════════════════════════════════
name: Qwen38-27B-TXT
description: Qwen3.8-27B NVFP4 — NInfer 推理引擎（纯文本，256K 上下文，MTP 投机解码）
type: ninfer
gpu_role: exclusive
model_type: llm
quantization: NVFP4
peak_vram_mb: 30500
ninfer:
  served_name: Qwen38-27B-TXT
  weight_path: ~/models/ninfer-nvfp4/qwen3_8_27b_nvfp4.ninfer
  docker_image: ninfer:auto
  port: 8007
  container_name: iff-ninfer-qwen38
  max_context: 155000
  kv_capacity: 632000
  kv_dtype: nvfp4
  weight_precision: NVFP4
  max_concurrency: 4
  default_max_tokens: 24576
  prefill_chunk: 2048
  pending_timeout_ms: 600000
  enable_mtp: true
  draft_tokens: 1
  enable_lm_head_draft: false
  startup_timeout: 120
  model_id: Qwen38-27B-TXT
  media_cache_mib: 0
  media_live_mib: 384
