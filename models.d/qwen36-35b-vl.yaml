name: qwen36-35b-vl
description: "Qwen3.6-35B-A3B MoE NVFP4 Abliterated (sakamakismile/Huihui Qwen3.6)"
gpu_role: exclusive
model_type: vl
quantization: NVFP4
peak_vram_mb: 30000

vllm:
  model_dir: Huihui-Qwen3.6-35B-A3B-abliterated-NVFP4
  served_name: qwen36-35b-vl
  port: 8008
  conda_env: qwen36-35b-vl
  max_model_len: 163840
  gpu_memory_utilization: 0.85
  max_num_seqs: 4
  kv_cache_dtype: fp8
  extra_flags: >-
    --max-num-batched-tokens 8192
    --moe-backend marlin
    --enable-prefix-caching
    --enable-chunked-prefill
    --async-scheduling
    --enable-auto-tool-choice
    --tool-call-parser qwen3_xml
    --reasoning-parser qwen3
    --trust-remote-code
    --attention-backend flashinfer
  extra_env:
    FLASHINFER_DISABLE_VERSION_CHECK: "1"
    VLLM_USE_DEEP_GEMM: "0"
  startup_timeout: 540